<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Yards After Combustion: run Kittle Aerospace, launch the booster, and catch it with the tower.">
<meta name="theme-color" content="#0e111d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<!-- Base reset carried over from the claude.ai artifact host so the page renders identically standalone. -->
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Yards After Combustion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed 3D spaceport, glass control sheet (right column on desktop, bottom sheet on phones), mission HUDs overlay the canvas. */
:root {
  --night: #0e111d;          /* desert night indigo */
  --glass: rgba(16, 19, 33, 0.86);
  --glass-2: rgba(30, 34, 54, 0.92);
  --line: rgba(231, 208, 168, 0.16);
  --sand: #e4c896;           /* spaceport sand */
  --text: #f4eee3;
  --muted: #b0a796;
  --flame: #ff6a2b;          /* engine plume */
  --gold: #f3b63c;           /* catch / celebration */
  --go: #4cd28c;
  --nogo: #ff4f5f;
  --data: #86bdf0;
  --f-display: "Saira Stencil One", "Impact", "Arial Narrow", sans-serif;
  --f-ui: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--f-ui); font-size: 15px; overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { position: relative; height: 100%; overflow: hidden; background: var(--night); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
#ui > * { pointer-events: auto; }
button { font-family: var(--f-ui); color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
#topbar { position: absolute; top: 10px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 18px; letter-spacing: .5px; color: var(--sand); line-height: 1;
  padding: 7px 10px; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); white-space: nowrap; }
.brand b { color: var(--flame); font-weight: 400; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip { display: flex; align-items: center; gap: 6px; padding: 5px 9px; background: var(--glass); border: 1px solid var(--line);
  border-radius: var(--r); font-size: 13px; white-space: nowrap; }
.chip .lbl { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.chip .val { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
.meter { width: 46px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--gold); transition: width .4s; }
.chip.cash .val { color: var(--go); }
.chip.cash.neg .val { color: var(--nogo); }
#spark { width: 54px; height: 18px; }
.iconbtn { width: 34px; height: 34px; border-radius: var(--r); border: 1px solid var(--line); background: var(--glass);
  display: grid; place-items: center; font-size: 16px; }

#ticker { position: absolute; top: 56px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  height: 24px; overflow: hidden; border-radius: 6px; background: rgba(10,12,22,.55); font-size: 12.5px; color: var(--sand);
  pointer-events: none !important; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
#tickerTrack { white-space: nowrap; display: inline-block; padding-left: 100%; line-height: 24px; animation: tick 60s linear infinite; }
#tickerTrack span { margin-right: 48px; }
#tickerTrack span::before { content: "▸ "; color: var(--flame); }
@keyframes tick { to { transform: translateX(-100%); } }

/* ---------- panel ---------- */
#panel { position: absolute; display: flex; flex-direction: column; background: var(--glass); border: 1px solid var(--line);
  border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow: hidden; }
#panelHead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
#panelHead h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0; letter-spacing: .4px; flex: 1; text-wrap: balance; }
#panelHead .toggle { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: transparent; }
#panelBody { overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
#panel.min #panelBody { display: none; }
#nav { position: absolute; display: flex; gap: 4px; padding: 4px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; }
#nav button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 10px; font-size: 13px; font-weight: 600;
  letter-spacing: .8px; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
#nav button span { font-size: 17px; line-height: 1; }
#nav button.on { background: rgba(243,182,60,.14); color: var(--gold); }
#nav button .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--flame); display: none; }
#nav button.alert .dot { display: block; }

@media (min-width: 900px) {
  #panel { top: 92px; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 84px; width: 410px; }
  #nav { right: max(16px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 410px; }
  #panelHead .toggle { display: none; }
}
@media (max-width: 1099px) {
  #topbar { flex-wrap: nowrap; }
  .chips { flex-wrap: nowrap; overflow: hidden; }
  .chip .lbl { display: none; }
  #spark { display: none; }
}
@media (max-width: 899px) {
  #panel { left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: 74px; max-height: 52%; }
  #nav { left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: 8px; }
  .brand { font-size: 15px; padding: 6px 8px; }
  .chip { padding: 4px 7px; }
  .chip .lbl { display: none; }
  .meter { width: 32px; }
  #spark { display: none; }
  #ticker { top: 52px; }
}

/* ---------- shared bits ---------- */
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec > h3 { margin: 0; font-size: 11.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.btn { border: 1px solid var(--line); background: var(--glass-2); border-radius: 9px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: rgba(243,182,60,.5); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #ff7a3d, #e5531c); border-color: #ff8a52; color: #1a0d05; }
.btn.gold { background: linear-gradient(180deg, #f8c75a, #e0a12a); border-color: #ffd47a; color: #241703; }
.btn.go { background: linear-gradient(180deg, #5fe09c, #36b874); border-color: #7cf0b2; color: #052113; }
.btn.wide { width: 100%; padding: 11px 14px; font-size: 15px; letter-spacing: .4px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(255,255,255,.025); display: flex; flex-direction: column; gap: 6px; }
.card.active { border-color: rgba(243,182,60,.6); background: rgba(243,182,60,.07); }
.tag { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--sand); font-weight: 600; }
.tag.sub { color: #9fd3ff; } .tag.leo { color: var(--go); } .tag.moon { color: #d8d2ff; } .tag.mars { color: var(--flame); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.good { color: var(--go); } .bad { color: var(--nogo); } .warn { color: var(--gold); }
.title-sm { font-weight: 700; font-size: 15px; }

/* field strip: race to the end zone */
.field { position: relative; height: 54px; border-radius: 8px; overflow: hidden;
  background: repeating-linear-gradient(90deg, #2f6b3a 0 10%, #2a6034 10% 20%); border: 1px solid rgba(255,255,255,.12); }
.field .ez { position: absolute; top: 0; bottom: 0; width: 9%; display: grid; place-items: center; font-family: var(--f-display); font-size: 11px;
  color: rgba(255,255,255,.85); writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 1px; }
.field .ez.home { left: 0; background: #7b2430; } .field .ez.away { right: 0; background: #b8862a; }
.field .yl { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.35); }
.field .yl b { position: absolute; bottom: 2px; left: 3px; font-size: 9px; color: rgba(255,255,255,.75); font-family: var(--f-mono); font-weight: 400; }
.field .pin { position: absolute; top: 6px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; transition: left .6s; border: 2px solid #fff; }
.field .pin.you { background: var(--flame); color: #200; }
.field .pin.rival { background: #c6ccd6; color: #222; top: 28px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

/* hangar */
.slot { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; }
.slot .nm { font-weight: 700; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--sand); }
.slot .opts { grid-column: 1 / -1; display: flex; gap: 5px; flex-wrap: wrap; }
.opt { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 5px 8px; font-size: 12.5px; text-align: left; line-height: 1.15; }
.opt small { display: block; color: var(--muted); font-size: 10.5px; font-family: var(--f-mono); }
.opt.on { border-color: var(--gold); background: rgba(243,182,60,.12); }
.opt:disabled { opacity: .35; }
.step { display: flex; align-items: center; gap: 2px; }
.step button { width: 30px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--glass-2); font-size: 16px; line-height: 1; }
.step b { min-width: 26px; text-align: center; font-family: var(--f-mono); }
.dvbar { position: relative; height: 16px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: visible; }
.dvbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #3d8de0, var(--data)); }
.dvbar .exp { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: rgba(134,189,240,.25); }
.dvbar .tgt { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--gold); }
.dvbar .tgt::after { content: "TARGET"; position: absolute; top: -13px; left: -14px; font-size: 9px; color: var(--gold); letter-spacing: 1px; }
.issues { font-size: 13px; color: var(--nogo); display: flex; flex-direction: column; gap: 3px; }

/* ---------- HUD: flight ---------- */
.hud { position: absolute; inset: 0; pointer-events: none !important; }
.hud > * { pointer-events: auto; }
.tele { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.tele > div { background: var(--glass); border: 1px solid var(--line); border-radius: 9px; padding: 4px 9px; text-align: center; min-width: 64px; }
.tele .lbl { display: block; font-size: 9.5px; letter-spacing: 1.4px; color: var(--muted); }
.tele b { font-family: var(--f-mono); font-size: 17px; font-variant-numeric: tabular-nums; }
.tele i { font-style: normal; font-size: 10px; color: var(--muted); margin-left: 2px; }
.gauges { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 150px; width: 168px; display: flex; flex-direction: column; gap: 8px; }
.gauge { background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; }
.gauge .lbl { font-size: 10px; letter-spacing: 1.3px; color: var(--muted); display: flex; justify-content: space-between; }
.gauge .lbl b { color: var(--text); font-family: var(--f-mono); font-weight: 600; }
.gbar { position: relative; height: 9px; margin-top: 5px; border-radius: 5px; background: rgba(255,255,255,.08); overflow: hidden; }
.gbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--data); border-radius: 5px; }
.gbar .lim { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--nogo); }
.gauge.hot { border-color: var(--nogo); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { box-shadow: 0 0 0 3px rgba(255,79,95,.35); } }
.throttle { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 150px; width: 76px; background: var(--glass); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.throttle .lbl { font-size: 10px; letter-spacing: 1.3px; color: var(--muted); }
.throttle b { font-family: var(--f-mono); font-size: 16px; }
#thrTrack { position: relative; width: 30px; height: 150px; border-radius: 8px; background: rgba(255,255,255,.07); touch-action: none; cursor: ns-resize; }
#thrFill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px; background: linear-gradient(0deg, var(--flame), #ffc06a); }
#thrTrack .floor { position: absolute; left: -4px; right: -4px; height: 2px; background: var(--muted); bottom: 40%; }
.throttle .q { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.throttle .q button { border: 1px solid var(--line); background: var(--glass-2); border-radius: 7px; padding: 5px 0; font-family: var(--f-mono); font-size: 12px; }
.fbottom { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; width: min(560px, calc(100% - 32px)); display: flex; gap: 8px; align-items: stretch; }
.fuel { flex: 1; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 18px; min-width: 0; }
.fuel .lbl { font-size: 10px; letter-spacing: 1.3px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.fuel .lbl b { color: var(--text); font-family: var(--f-mono); }
.fuelbar { position: relative; height: 14px; margin-top: 6px; border-radius: 6px; background: rgba(255,255,255,.08); }
.fuelbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #f0a03a, var(--sand)); }
.fuelbar .rz { position: absolute; top: -3px; bottom: -3px; left: 5%; width: 9%; border: 1px dashed var(--go); border-radius: 4px; }
.fuelbar .rz::after { content: "RECOVERY"; position: absolute; bottom: -15px; left: 0; font-size: 8.5px; letter-spacing: 1px; color: var(--go); white-space: nowrap; }
#btnStage { min-width: 116px; border-radius: 12px; border: 2px solid #ff8a52; background: linear-gradient(180deg, #ff7a3d, #d9471a); color: #1a0703;
  font-family: var(--f-display); font-size: 18px; letter-spacing: .5px; padding: 6px 12px; }
#btnStage:disabled { opacity: .35; }
#btnStage.ready { animation: pulseg .6s infinite alternate; }
@keyframes pulseg { to { box-shadow: 0 0 0 5px rgba(255,138,82,.35); } }
#btnWarp { width: 100%; border: 1px solid rgba(243,182,60,.45); background: rgba(243,182,60,.12); color: var(--gold);
  border-radius: 7px; padding: 5px 0; font-family: var(--f-mono); font-size: 13px; font-weight: 700; }
#coach { position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px; max-width: min(520px, calc(100% - 32px)); text-align: center;
  background: rgba(10,12,22,.78); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 14px; pointer-events: none !important; }
#coach:empty { display: none; }
#coach.alert { border-color: var(--nogo); color: #ffd6da; }

/* ---------- HUD: catch ---------- */
#radarWrap { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 88px; background: var(--glass); border: 1px solid var(--line);
  border-radius: 12px; padding: 6px; }
#radar { width: 150px; height: 150px; display: block; }
#radarWrap .lbl { font-size: 9.5px; letter-spacing: 1.3px; color: var(--muted); text-align: center; margin-top: 2px; }
.ladder { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 88px; width: 64px; height: 230px; background: var(--glass);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ladder .zone { position: absolute; left: 8px; right: 8px; border-radius: 4px; }
.ladder .zone.win { background: rgba(76,210,140,.25); border: 1px solid var(--go); }
.ladder .zone.spike { background: rgba(243,182,60,.35); }
.ladder .arm { position: absolute; left: 0; right: 0; height: 2px; background: var(--sand); }
.ladder .mark { position: absolute; left: 4px; right: 4px; height: 6px; margin-top: -3px; border-radius: 3px; background: #fff; box-shadow: 0 0 8px #fff; }
.ladder .cap { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 9px; letter-spacing: 1px; color: var(--muted); }
.ladder .val { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 12px; }
#joy { position: absolute; left: max(22px, calc(env(safe-area-inset-left, 0px) + 22px)); bottom: 26px; width: 132px; height: 132px; border-radius: 50%;
  background: rgba(16,19,33,.55); border: 2px solid var(--line); touch-action: none; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff4, #fff1); border: 2px solid var(--sand); }
#joy .hint { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: 1.2px; color: var(--muted); }
#btnClose { position: absolute; right: max(22px, calc(env(safe-area-inset-right, 0px) + 22px)); bottom: 30px; width: 136px; height: 120px; border-radius: 22px;
  border: 2px solid #ffd47a; background: linear-gradient(180deg, #f8c75a, #d79622); color: #241703; font-family: var(--f-display); font-size: 21px; line-height: 1.05;
  touch-action: manipulation; }
#btnClose.hot { animation: pulsegold .35s infinite alternate; }
@keyframes pulsegold { to { box-shadow: 0 0 0 7px rgba(243,182,60,.4); } }
#btnClose:disabled { opacity: .5; }
#catchInfo { position: absolute; left: 50%; transform: translateX(-50%); bottom: 40px; background: var(--glass); border: 1px solid var(--line); border-radius: 10px;
  padding: 5px 10px; font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
#catchKeys { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; font-size: 12px; color: var(--muted); pointer-events: none !important; }
@media (max-width: 899px) { #catchKeys { display: none; } .gauges { width: 140px; } #catchInfo { bottom: auto; top: 250px; } }
@media (max-width: 560px) {
  .brand { display: none; }
  #topbar { flex-wrap: nowrap; gap: 5px; top: 8px; }
  .chips { flex-wrap: nowrap; gap: 5px; overflow: hidden; }
  .chip { padding: 4px 6px; gap: 4px; font-size: 12px; }
  .chip .val { font-size: 12px; }
  .meter { width: 22px; }
  #btnSound { display: none; }
  .iconbtn { width: 32px; height: 30px; }
  #ticker { top: 46px; }
  .tele { top: 48px; }
  .tele > div { min-width: 52px; padding: 3px 6px; } .tele b { font-size: 14px; }
  .gauges { top: 104px; } .throttle { top: 104px; width: 64px; } #thrTrack { height: 110px; }
  #radarWrap, .ladder { top: 50px; }
  #radar { width: 120px; height: 120px; } .ladder { height: 190px; width: 56px; }
  #catchInfo { top: auto; bottom: 168px; }
  #btnClose { width: 118px; height: 104px; font-size: 18px; }
  #joy { width: 118px; height: 118px; }
}

/* ---------- callouts / modal / toasts ---------- */

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
const L = (() => {
// ===================================================================
//  Yards After Combustion — core game logic (pure: no DOM, no Three)
//  Kittle Aerospace, est. #85
// ===================================================================
const G0 = 9.80665;
const R_E = 6371000;
const CDA = 3.4;          // drag area, m² (Cd·A)
const Q_LIMIT = 33000;    // Pa, structural Max-Q limit
const PITCH_K = 26000;    // gravity-turn altitude constant (m)

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------- Parts catalog ----------------
const PARTS = {
  bEng: [
    { id: 'te1', name: 'TE-1 "Tight End"', thrust: 850, ispSL: 282, ispVac: 311, mass: 0.55, cost: 0.7, tier: 0,

    { id: 'wr2', name: 'WR-2 "Wheel Route" Vac', thrust: 1350, isp: 372, mass: 1.1, cost: 2.6, tier: 1,

    { id: 'ls85', name: 'LS-85 "Long Snapper"', thrust: 480, isp: 455, mass: 0.9, cost: 4.8, tier: 2,

  ],

      blurb: 'Free. Steering on the way home is mostly vibes.' },
    { id: 'grid', name: 'Grid Fins', mass: 1.0, cost: 0.5, authority: 1.0, tier: 0,
      blurb: 'Standard steering for The Catch.' },
    { id: 'stick', name: 'Stickum Ti Grid Fins', mass: 1.2, cost: 1.6, authority: 1.45, tier: 1,
      blurb: 'Titanium. Grippy. Totally league-legal.' },
  ],
  fairing: [
    { id: 's', name: 'Fairing S', maxPayload: 6, mass: 0.8, cost: 0.3, tier: 0, h: 9 },
    { id: 'm', name: 'Fairing M', maxPayload: 16, mass: 1.8, cost: 0.8, tier: 0, h: 12 },
    { id: 'l', name: 'Fairing L', maxPayload: 40, mass: 3.4, cost: 1.6, tier: 1, h: 15 },
  ],
  shield: [
    { id: 'none', name: 'No shield', mass: 0, cost: 0, tier: 0, blurb: 'Hope the junk misses.' },
    { id: 'pancake', name: 'Pancake Block Shield', mass: 1.2, cost: 1.5, tier: 1,
      blurb: 'Debris armor. Flattens space junk on contact.' },
  ],
};
const BTANK = { prop: 70, dry: 4.6, cost: 0.6, h: 6 };
const UTANK = { prop: 25, dry: 1.9, cost: 0.4, h: 4 };
const LIMITS = [
  { bTanks: 3, uTanks: 1, bCount: 5, uCount: 1 },
  { bTanks: 6, uTanks: 3, bCount: 9, uCount: 2 },
  { bTanks: 8, uTanks: 5, bCount: 9, uCount: 3 },
  { bTanks: 8, uTanks: 5, bCount: 9, uCount: 3 },
];
const PAD_OPS = 1.2;       // $M per launch
const PAYROLL = 0.15;      // $M per day
const RESERVE_MIN = 0.05;  // boostback minimum
const RESERVE_REC = 0.10;  // recommended recovery reserve

function part(list, id) {
  return PARTS[list].find(p => p.id === id) || PARTS[list][0];
}

// ---------------- Tiers / progression ----------------
const TIERS = [
  { id: 'sub', name: 'Suborbital Hops', short: 'SUB', target: 6500, need: 2, payload: [1, 3], pay: [9, 14],
    missions: ['Upper-atmosphere sounding', 'Microgravity science hop', 'Highlight-reel camera drop', 'Tourist hop (3 seats)'] },
  { id: 'leo', name: 'Low Earth Orbit', short: 'LEO', target: 8800, need: 3, payload: [2, 8], pay: [36, 54],
    missions: ['Weather satellite', 'Broadband sat batch', 'Cubesat rideshare', 'Earth-imaging sat'] },
  { id: 'moon', name: 'Moon Base', short: 'MOON', target: 11600, need: 2, payload: [3, 7], pay: [115, 150],
    missions: ['Lunar habitat module', 'Moon base power unit', 'Lunar rover', 'Regolith lab'] },
  { id: 'mars', name: 'Mars: The End Zone', short: 'MARS', target: 12300, need: 1, payload: [2, 3], pay: [300, 300],
    missions: ['Mars lander "Touchdown"'] },
];
const CLIENTS = [
  'Seam Route Telecom', 'Fourth & Long Insurance', 'Play-Action Pictures', 'Hail Mary Biotech',
  'Two-Minute Drill Logistics', 'Audible Broadband', 'Open Field Labs', 'Red Zone Mining',
  'Desert Sun Weather', 'Lunar Tailgate Co.', 'Goal Line Geodesy', 'Chain Gang Surveying',
  'Fair Catch Aquatics', 'Blitz Pickup Systems', 'Hang Time Research',
];

const UPGRADES = [
  { id: 'hands2', name: 'The Hands Mk II', cost: 8, tier: 0,
    desc: 'Longer arm travel. Catch window +40%.' },
  { id: 'radar', name: 'Doppler Weather Radar', cost: 4, tier: 0,
    desc: 'Three-day forecast, so you can plan around storms.' },
  { id: 'turn', name: 'Rapid Turnaround Crew', cost: 10, tier: 1,
    desc: 'Pad prep drops from 4 days to 2. The crew grumbles a little.' },
  { id: 'composite', name: 'Composite Tanks', cost: 14, tier: 1,
    desc: 'Tank dry mass −20%. More ΔV from the same rocket.' },
  { id: 'hands3', name: 'The Hands Mk III', cost: 22, tier: 1, req: 'hands2',
    desc: 'Arms auto-track the booster. Catch window +80% total.' },
  { id: 'tuning', name: 'Engine Tuning Lab', cost: 18, tier: 2,
    desc: 'Every engine gets +3% Isp.' },
];

function handsLevel(up) { return up.hands3 ? 2 : up.hands2 ? 1 : 0; }

// ---------------- Rocket stats ----------------
function rocketStats(d, payload, up = {}) {
  const be = part('bEng', d.bEng), ue = part('uEng', d.uEng);
  const fin = part('fins', d.fins), fair = part('fairing', d.fairing), sh = part('shield', d.shield);
  const dryMul = up.composite ? 0.8 : 1;
  const ispMul = up.tuning ? 1.03 : 1;
  const bProp = d.bTanks * BTANK.prop;
  const bDry = d.bTanks * BTANK.dry * dryMul + d.bCount * be.mass + fin.mass + 2.0;
  const uProp = d.uTanks * UTANK.prop;
  const uDry = d.uTanks * UTANK.dry * dryMul + d.uCount * ue.mass + 0.8 + sh.mass;
  const upperWet = uProp + uDry + fair.mass + payload;
  const upperFinal = upperWet - uProp;
  const liftoff = bProp + bDry + upperWet;
  const thrust = d.bCount * be.thrust;
  const twr = thrust / (liftoff * G0);
  const uIsp = ue.isp * ispMul;
  const upperDV = uIsp * G0 * Math.log(upperWet / upperFinal);
  const upperTWR = (d.uCount * ue.thrust) / (upperWet * G0);
  const boosterCost = d.bCount * be.cost + d.bTanks * BTANK.cost + fin.cost + 0.8;
  const upperCost = d.uCount * ue.cost + d.uTanks * UTANK.cost + fair.cost + sh.cost + 0.4;
  const boosterIdeal = lerp(be.ispSL, be.ispVac, 0.55) * ispMul * G0 *
    Math.log(liftoff / (liftoff - bProp * (1 - RESERVE_REC)));
  return {
    be, ue, fin, fair, sh, bProp, bDry, uProp, uDry, upperWet, upperFinal, liftoff, thrust, twr,
    uIsp, upperDV, upperTWR, boosterCost, upperCost, cost: boosterCost + upperCost, boosterIdeal,
    ispMul, payload, fitsFairing: payload <= fair.maxPayload,
    heightBooster: d.bTanks * BTANK.h + 7, heightUpper: d.uTanks * UTANK.h + 3 + fair.h,
  };
}

function validateDesign(d, payload, up, tierIdx) {
  const s = rocketStats(d, payload, up);
  const lim = LIMITS[tierIdx];
  const issues = [];
  if (!s.fitsFairing) issues.push(`Payload (${payload} t) is too big for ${s.fair.name}. Pick a larger fairing.`);
  if (s.twr < 1.15) issues.push(`Liftoff thrust-to-weight is ${s.twr.toFixed(2)}. It needs at least 1.15 to clear the tower.`);
  if (d.bTanks > lim.bTanks || d.uTanks > lim.uTanks || d.bCount > lim.bCount || d.uCount > lim.uCount)
    issues.push('Some parts exceed your current tier limits.');
  return { s, issues, ok: issues.length === 0 };
}

// ---------------- Ascent flight sim ----------------
function pitchProgram(y) {
  if (y < 220) return 0;
  return (Math.PI / 2) * (1 - Math.exp(-(y - 220) / PITCH_K));
}

function createFlight(d, payload, up = {}, env = {}) {
  const s = rocketStats(d, payload, up);
  return {
    t: 0, x: 0, y: 0, vx: 0, vy: 0,
    m: s.liftoff * 1000, propB: s.bProp * 1000, propB0: s.bProp * 1000,
    nEng: d.bCount, nEng0: d.bCount,
    thrustSL: s.be.thrust * 1000, ispSL: s.be.ispSL * s.ispMul, ispVac: s.be.ispVac * s.ispMul,
    throttle: 1, stress: 0, q: 0, qEff: 0, maxQ: 0, theta: 0, accelG: 1, isp: s.be.ispSL,
    windShear: (env.wind || 0) / 150, qLimit: Q_LIMIT,
    anomalyT: env.anomalyT ?? null, anomalyFired: false, sputter: 0,
    stats: s, events: [], done: false, result: null, thrustOn: true,
  };
}

function stepFlight(f, dt, thrCmd) {
  if (f.done) return;
  const thr = clamp(thrCmd, 0.4, 1);
  f.throttle = thr;
  if (f.anomalyT != null && !f.anomalyFired && f.t >= f.anomalyT) {
    f.anomalyFired = true;
    if (f.nEng > 1) { f.nEng--; f.events.push({ t: f.t, type: 'engineout' }); }
    else { f.sputter = 2.0; f.events.push({ t: f.t, type: 'sputter' }); }
  }
  if (f.sputter > 0) f.sputter -= dt;
  const pr = Math.exp(-Math.max(0, f.y) / 8500);
  const isp = f.ispVac - (f.ispVac - f.ispSL) * pr;
  const on = f.propB > 0 && f.sputter <= 0;
  let mdot = on ? (thr * f.nEng * f.thrustSL) / (f.ispSL * G0) : 0;
  if (mdot * dt > f.propB) mdot = f.propB / dt;
  const F = mdot * isp * G0;
  const theta = pitchProgram(f.y);
  const v = Math.hypot(f.vx, f.vy);
  const rho = 1.225 * pr;
  const q = 0.5 * rho * v * v;
  const dAcc = (q * CDA) / f.m;
  const r = R_E + f.y;
  const g = G0 * (R_E / r) ** 2;
  const ux = v > 1e-6 ? f.vx / v : 0, uy = v > 1e-6 ? f.vy / v : 0;
  const ax = (F / f.m) * Math.sin(theta) - dAcc * ux;
  const ay = (F / f.m) * Math.cos(theta) - dAcc * uy - g + (f.vx * f.vx) / r;
  f.vx += ax * dt; f.vy += ay * dt;
  if (f.y <= 0 && f.vy < 0 && f.t < 8) { f.vy = 0; f.vx = 0; } // still on the mount
  f.x += f.vx * dt; f.y += f.vy * dt;
  if (f.y < 0) f.y = 0;
  f.propB -= mdot * dt; f.m -= mdot * dt;
  if (f.propB < 0) f.propB = 0;
  f.q = q; f.isp = isp; f.theta = theta; f.thrustOn = on;
  f.accelG = F / f.m / G0;
  f.qEff = q * (1 + f.windShear);
  f.maxQ = Math.max(f.maxQ, f.qEff);
  const over = f.qEff / f.qLimit - 1;
  if (over > 0) f.stress += over * 1.1 * dt;
  else f.stress = Math.max(0, f.stress - 0.05 * dt);
  f.t += dt;
  if (f.stress >= 1) { f.done = true; f.result = 'rud-maxq'; f.events.push({ t: f.t, type: 'rud' }); }
  else if (f.t > 8 && f.y <= 0) { f.done = true; f.result = 'rud-ground'; f.events.push({ t: f.t, type: 'rud' }); }
}

function autoThrottle(f, cur, dt) {
  if (f.qEff > 0.9 * f.qLimit) return Math.max(0.4, cur - 1.4 * dt);
  return Math.min(1, cur + 0.5 * dt);
}

function stageResult(f, target) {
  const s = f.stats;
  const v = Math.hypot(f.vx, f.vy);
  const reserve = f.propB / f.propB0;
  const eff = 0.82 + 0.11 * Math.min(1, s.upperTWR / 0.8);
  const altKm = f.y / 1000;
  let penalty = 0;
  if (altKm < 35) penalty += (35 - altKm) * 30;
  if (f.vy < 0) penalty += -f.vy * 0.5;
  const upperEff = Math.max(0, s.upperDV * eff - penalty);
  const total = v + upperEff;
  return { vStage: v, altKm, reserve, eff, penalty, upperEff, total, target, margin: total - target,
    success: total >= target, downrangeKm: f.x / 1000, t: f.t };
}

// Headless "ideal pilot" estimate used by the hangar
function estimate(d, payload, up, target, reserve = RESERVE_REC, wind = 15) {
  const f = createFlight(d, payload, up, { wind });
  if (f.stats.twr < 1.0) return { ok: false, reason: 'twr', total: 0, target };
  let thr = 1, dt = 0.1;
  while (!f.done && f.t < 900) {
    thr = autoThrottle(f, thr, dt);
    stepFlight(f, dt, thr);
    if (f.propB / f.propB0 <= reserve + 1e-9) break;
  }
  if (f.done) return { ok: false, reason: f.result, total: 0, target, maxQ: f.maxQ };
  const r = stageResult(f, target);
  return { ok: true, ...r, maxQ: f.maxQ };
}

// ---------------- Catch minigame ----------------
function catchProfile(reserve, finsAuthority, hLevel, windKmh) {
  if (reserve < RESERVE_MIN) return null;
  const ff = clamp((reserve - RESERVE_MIN) / 0.09, 0, 1); // 0 = fumes, 1 = fat reserve
  const w = windKmh / 3.6;
  return {
    fuel: ff,
    startH: 520,
    decel: lerp(6.0, 3.6, ff),
    vMin: lerp(3.4, 1.4, ff),
    hover: lerp(0.35, 1.9, ff),
    authority: 4.4 * finsAuthority,

function createCatch(p, rnd) {

    windDir: rnd() * Math.PI * 2, gp1: rnd() * 10, gp2: rnd() * 10,
    closing: -1, done: false, grade: null, grounded: false,
  };
}

function stepCatch(c, p, dt, ix, iz) {
  if (c.done) return;
  c.t += dt;
  // vertical: automated landing burn profile
  let vd;
  if (c.h > 0.4) vd = Math.sqrt(2 * p.decel * Math.max(0, c.h)) * 0.92 + p.vMin;
  else if (c.hoverLeft > 0) { vd = 0.25; c.hoverLeft -= dt; }

  c.vd = vd;
  c.h -= vd * dt;
  // lateral: grid fins + wind + gusts + aero damping
  const gx = Math.sin(c.t * 0.9 + c.gp1) * Math.sin(c.t * 0.37 + c.gp2);
  const gz = Math.cos(c.t * 0.7 + c.gp2) * Math.sin(c.t * 0.29 + c.gp1);
  const wx = Math.cos(c.windDir) * p.wind + gx * p.gust;
  const wz = Math.sin(c.windDir) * p.wind + gz * p.gust;
  const mag = Math.hypot(ix, iz); if (mag > 1) { ix /= mag; iz /= mag; }
  c.vx += (ix * p.authority + wx - 0.45 * c.vx) * dt;
  c.vz += (iz * p.authority + wz - 0.45 * c.vz) * dt;
  c.x += c.vx * dt; c.z += c.vz * dt;
}

function gradeCatch(c, p) {
  const d = Math.hypot(c.x, c.z), e = c.h, vl = Math.hypot(c.vx, c.vz);
  const base = { d, e, vl };
  if (e >= 4) return { ...base, grade: 'miss', reason: 'early' };
  if (e <= -2.5) return { ...base, grade: 'miss', reason: 'late' };
  if (d < p.tol * 0.38 && vl < 1.8 && e > -1 && e < 2) return { ...base, grade: 'spike' };
  if (d < p.tol && vl < 4.2) return { ...base, grade: 'clean' };
  if (d < p.tol * 1.6) return { ...base, grade: 'bobble' };
  return { ...base, grade: 'miss', reason: 'wide' };
}

  const pay = Math.round(lerp(T.pay[0], T.pay[1], rnd()) + payload * (tierIdx + 1) * 0.6);

function refillContracts() {

  const mine = S.contracts.filter(c => c.tier === S.tier);
  for (let i = mine.length; i < want; i++) S.contracts.push(L.makeContract(S.tier, S.day, rnd));

  if (S.tier === 3 && S.contracts.filter(c => c.tier === 2).length < 2) S.contracts.push(L.makeContract(2, S.day, rnd));

function advanceDays(n) {
  for (let i = 0; i < n; i++) {
    if (S.lost || S.won) return;
    S.day++;
    S.cash -= L.PAYROLL;
    S.hype += (25 - S.hype) * 0.03;
    S.morale += (62 - S.morale) * 0.04;
    S.price = Math.max(0.5, S.price * (1 + (S.hype - 40) / 2500 + (rnd() - 0.5) * 0.04));
    pushPrice();
    S.weather.shift(); while (S.weather.length < 4) S.weather.push(L.rollWeather(rnd));
    for (const c of [...S.contracts]) {
      if (c.id === S.active) {
        if (S.day > c.deadline) {
          S.contracts = S.contracts.filter(x => x !== c); S.active = null;
          if (S.pad && S.pad.contract === c.id) { S.pad.contract = null; S.pad.target = L.TIERS[S.tier].target; }
          news(`${c.client} walks away after Kittle Aerospace misses the deadline.`); toast(`Contract expired: ${c.client}. The rocket on the pad is now a test flight.`, 'bad', 4200);
        }
        continue;
      }
      if (S.day > c.deadline) { S.contracts = S.contracts.filter(x => x !== c); }
      else if (rnd() < 0.035) {
        S.contracts = S.contracts.filter(x => x !== c); S.price *= 0.99;
        news(`Smoothline Orbital swoops in on the ${c.client} contract. Their launch slips 0.5 s off the line.`);
      }
    }
    refillContracts();
    const ms = L.rivalStep(S, rnd);
    if (ms) news(['', 'Smoothline Orbital reaches orbit, poses for 400 photos.', 'Smoothline Orbital lands on the Moon. CEO wears a cape.', 'Smoothline Orbital launches for Mars. Kittle Aerospace, you are on the clock.', ''][ms] || 'Smoothline Orbital lands on Mars.');
    if (S.merchCooldown > 0) S.merchCooldown--;
    if (S.rival >= 4) { S.lost = 'rival'; break; }
  }
  clampState();
  if (S.cash < -10 && !S.lost) S.lost = 'broke';
  save();
}

function goTab(t) {
  if (!S) return;
  if (S.lost || S.won) { endScreen(); return; }
  tab = t; mode = t; showUI(t);
  ENV.alt = 0; setWeatherVisual(S.weather[0]);
  if (t === 'hangar') {
    placeVabRocket();
    const h = vabRocket.totalH;
    setGoal({ target: new THREE.Vector3(VAB.x, h * 0.48 + 2, VAB.z), dist: Math.max(62, h * 1.2 + 30) * (innerWidth < 900 ? 1.5 : 1), el: 0.1, az: 0.12, auto: 0, minD: 30, maxD: 300 });
    focusShadows(VAB);
  } else if (t === 'pad') {
    const h = padRocket ? padRocket.totalH : 40;
    setGoal({ target: new THREE.Vector3(MOUNT_X, MOUNT_H + h * 0.5, 0), dist: Math.max(90, h * 1.7 + 30) * (innerWidth < 900 ? 1.4 : 1), el: 0.12, az: 0.85, auto: 0.03, minD: 40, maxD: 600 });
    focusShadows(new THREE.Vector3(MOUNT_X, 0, 0));
  } else if (t === 'rnd') {
    setGoal({ target: new THREE.Vector3(MOUNT_X - 6, 55, 0), dist: 150, el: 0.2, az: 1.1, auto: 0.03, minD: 40, maxD: 600 });

  } else {
    setGoal({ target: new THREE.Vector3(-80, 26, 30), dist: 360, el: 0.26, az: null, auto: 0.02, minD: 60, maxD: 1400 });

    focusShadows(new THREE.Vector3(-60, 0, 30));

}

// ---------------- actions ----------------
function act(a, el) {
  sfx.unlock(); sfx.click();
  const v = el && el.dataset.v, k = el && el.dataset.k;
  switch (a) {
    case 'tab': goTab(v); break;
    case 'accept': if (S.pad) break; S.active = v; save(); toast('Contract accepted. Head to the Hangar to build.', 'good'); placeVabRocket(); renderPanel(); break;
    case 'drop': S.active = null; save(); renderPanel(); break;
    case 'set': S.design[k] = v; snapAnim = 1; sfx.snap(); save(); placeVabRocket(); renderPanel(); break;
    case 'inc': {
      const lim = L.LIMITS[S.tier], max = { bCount: lim.bCount, bTanks: lim.bTanks, uCount: lim.uCount, uTanks: lim.uTanks }[k];
      S.design[k] = THREE.MathUtils.clamp(S.design[k] + (+el.dataset.d), 1, max); snapAnim = 1; sfx.snap(); save(); placeVabRocket(); renderPanel(); break;
    }
    case 'roll': rollToPad(); break;
    case 'launch': startCountdown(); break;
    case 'audible':
      if (S.cash < 0.3 - 10) break;
      S.cash -= 0.3; advanceDays(1); setWeatherVisual(S.weather[0]);
      toast(`Audible called. Day ${S.day}: ${S.weather[0].cond}, ${S.weather[0].wind} km/h.`, S.weather[0].cond === 'Storm' ? 'bad' : 'good');
      if (S.lost) { endScreen(); break; } renderPanel(); break;
    case 'buy': {
      const u = L.UPGRADES.find(x => x.id === v); if (!u || S.cash < u.cost || S.upgrades[u.id]) break;
      S.cash -= u.cost; S.upgrades[u.id] = true; S.stats.spent += u.cost; news(`Kittle Aerospace installs ${u.name}.`); toast(`${u.name} installed.`, 'gold'); save(); renderPanel(); break;
    }
    case 'pizza': S.cash -= 0.4; S.morale += 8; S.lastPizza = S.day; clampState(); toast('Pizza party. The night shift is in.', 'good'); save(); renderPanel(); break;
    case 'bonus': S.cash -= 2.5; S.morale += 20; S.lastBonus = S.day; clampState(); toast('Bonuses paid. Morale way up.', 'good'); save(); renderPanel(); break;
    case 'dayoff': S.morale += 12; clampState(); advanceDays(1); toast('Crew took a day off. Fresh legs.', 'good'); if (S.lost) { endScreen(); break; } renderPanel(); break;
    case 'offering': {
      const raise = S.price * 1.5; S.cash += raise; S.price *= 0.9; S.hype -= 4; S.lastOffering = S.day; pushPrice(); clampState();
      news(`Kittle Aerospace raises ${fmtM(raise)} in a stock offering.`); toast(`Raised ${fmtM(raise)}.`, 'good'); save(); renderPanel(); break;
    }
    case 'wait': advanceDays(1); setWeatherVisual(S.weather[0]); if (S.lost) { endScreen(); break; } renderPanel(); break;
    case 'merch': merchDrop(el); break;
    case 'newgame': newGame(); break;
    case 'continue': { const sv = loadSave(); if (sv) startWith(sv); break; }
    case 'howto': howTo(); break;
    case 'menu': menu(); break;
    case 'restart': showModal(`<h2>Start a new season?</h2><p>Your current company, cash and progress will be wiped.</p><div class="row"><button class="btn" data-act="closeModal">Keep playing</button><button class="btn primary" data-act="newgame">Start over</button></div>`); break;
    case 'assist': assist = !assist; toast(assist ? 'Flight assist on: Max-Q throttling is automatic.' : 'Flight assist off: you call the throttle.', 'gold'); menu(); break;

  }
}

function rollToPad() {
  const payload = currentPayload(), target = currentTarget();
  const v = L.validateDesign(S.design, payload, S.upgrades, S.tier);
  const cost = v.s.cost + L.PAD_OPS;
  if (!v.ok || S.pad || S.cash - cost < -8) return;
  S.cash -= cost; S.stats.spent += cost;
  const c = activeContract();
  S.pad = { design: { ...S.design }, contract: c ? c.id : null, payload, cost: v.s.cost, boosterCost: v.s.boosterCost, target, tier: c ? c.tier : S.tier };
  const days = prepDays();
  if (S.upgrades.turn) S.morale -= 3;
  placePadRocket(S.pad.design, payload);
  advanceDays(days);
  if (S.lost) { endScreen(); return; }
  toast(`Stacked and rolled out after ${days} days. Day ${S.day}: ${S.weather[0].cond}.`, 'good', 3600);
  goTab('pad');
}
function merchDrop(el) {
  if (S.merchCooldown > 0) return;
  const cash = 0.6 + S.hype * 0.05;
  S.cash += cash; S.hype += 10; S.merchCooldown = 8; clampState(); save();
  news('"Rapid Unscheduled Disassembly" tees sell out in 11 minutes.');
  if (el) { el.disabled = true; el.textContent = `Merch dropped: +${fmtM(cash)}, +10 hype`; }
  sfx.cheer(); renderTop();
}

// ---------------- countdown + flight ----------------
let CD = null;
function startCountdown() {
  if (!S.pad || !padRocket) return;
  const w = S.weather[0]; if (w.cond === 'Storm') return;
  closeModal(); mode = 'countdown'; showUI('countdown'); setWeatherVisual(w);
  CD = { t: 0, step: -1 };
  const h = padRocket.totalH;
  setGoal({ target: new THREE.Vector3(MOUNT_X, MOUNT_H + h * 0.4, 0), dist: h * 1.6 + 40, el: 0.06, az: 0.7, auto: 0.02, minD: 30, maxD: 900 });
}
function updateCountdown(dt) {
  CD.t += dt;
  const marks = [[0, 'T−3'], [1, 'T−2'], [2, 'T−1'], [3, 'IGNITION'], [3.7, 'LIFTOFF']];
  for (let i = CD.step + 1; i < marks.length; i++) if (CD.t >= marks[i][0]) { CD.step = i; callout(marks[i][1], i >= 3 ? 'gold' : '', i === 4 ? 'Kittle Aerospace has cleared the snap' : '', 1100); sfx.beep(i >= 3); }
  if (CD.t > 3) {
    const r = padRocket; r.bFlame.visible = true; r.bFlame.material.uniforms.power.value = Math.min(1, (CD.t - 3) * 2); r.light.intensity = 3e4;
    for (let i = 0; i < 10; i++) { const a = Math.random() * Math.PI * 2; smoke.spawn(MOUNT_X + Math.cos(a) * 3, 2, Math.sin(a) * 3, Math.cos(a) * 40, 4 + Math.random() * 6, Math.sin(a) * 40 - 10, { life: 5, s0: 10, s1: 42, c0: [0.92, 0.86, 0.78], c1: [0.8, 0.72, 0.62], a: 0.75, drag: 0.6 }); }
    shake = 0.25; sfx.engine(0.6 * Math.min(1, CD.t - 3));
  }
  if (CD.t > 3.8) startFlight();
}

let FL = null;
function startFlight() {
  const P = S.pad, w = S.weather[0];
  const anomalyT = rnd() < anomalyChance() ? 18 + rnd() * 60 : null;
  FL = { f: L.createFlight(P.design, P.payload, S.upgrades, { wind: w.wind, anomalyT }), r: padRocket, thr: 1, warp: 4, staged: false, res: null,
    U: 0, debris: null, coachMsg: '', boomed: false, sonic: false, peakPassed: false, wind: w.wind, P, w, eventsSeen: 0, vapor: 0 };
  mode = 'flight'; showUI('flight'); setThrottleUI(1); updateWarpBtn();
  $('btnStage').disabled = true;
}
function setThrottleUI(v) {
  if (FL) FL.thr = THREE.MathUtils.clamp(v, 0.4, 1);
  const t = FL ? FL.thr : v;
  $('thrFill').style.height = (t * 100) + '%'; $('hThr').textContent = Math.round(t * 100) + '%';
}
function updateWarpBtn() { if (FL) $('btnWarp').textContent = FL.warp + '×'; }
$('btnWarp').addEventListener('click', () => { if (!FL) return; FL.warp = { 1: 2, 2: 4, 4: 8, 8: 1 }[FL.warp]; updateWarpBtn(); sfx.click(); });
for (const b of document.querySelectorAll('[data-thr]')) b.addEventListener('click', () => { setThrottleUI(+b.dataset.thr); sfx.click(); });
(() => {
  const tr = $('thrTrack'); let drag = false;
  const set = e => { const r = tr.getBoundingClientRect(); setThrottleUI(1 - (e.clientY - r.top) / r.height); };
  tr.addEventListener('pointerdown', e => { drag = true; tr.setPointerCapture(e.pointerId); set(e); });
  tr.addEventListener('pointermove', e => { if (drag) set(e); });
  tr.addEventListener('pointerup', () => { drag = false; });
})();
$('btnStage').addEventListener('click', () => { if (FL && !FL.staged && mode === 'flight') doStage(false); });

function coach(msg, alert) { if (FL.coachMsg !== msg) { FL.coachMsg = msg; $('coach').textContent = msg; } $('coach').classList.toggle('alert', !!alert); }

function updateFlight(dt) {
  const F = FL, f = F.f, r = F.r;
  const res = f.propB / f.propB0;
  const maxQish = f.qEff > 0.78 * L.Q_LIMIT || f.stress > 0.05;
  const warp = f.t < 8 || f.stress > 0.02 ? 1 : (maxQish || (res < 0.22 && res > 0.03)) ? Math.min(F.warp, 2) : F.warp;
  const sim = dt * warp, steps = Math.max(1, Math.ceil(sim / 0.05));
  for (let i = 0; i < steps; i++) {
    if (assist) F.thr = L.autoThrottle(f, F.thr, sim / steps);
    L.stepFlight(f, sim / steps, F.thr);
    if (f.done || f.propB <= 0) break;
  }
  if (assist) setThrottleUI(F.thr);
  // events
  while (F.eventsSeen < f.events.length) {
    const ev = f.events[F.eventsSeen++];
    if (ev.type === 'engineout') { callout('ENGINE OUT', 'red', `Lost one of ${f.nEng0}. Crew morale matters.`, 2200); toast('Engine anomaly. Remaining engines are carrying the load.', 'bad', 3000); }
    if (ev.type === 'sputter') { callout('ENGINE SPUTTER', 'red', 'Two seconds of silence', 1800); }
  }
  // place rocket
  r.root.position.set(MOUNT_X + f.x, MOUNT_H + f.y, 0);
  r.root.rotation.z = -f.theta + Math.sin(clockT * 7) * 0.002;
  ENV.alt = f.y;
  const vac = THREE.MathUtils.smoothstep(f.y, 6000, 45000);
  r.bFlame.visible = f.thrustOn; r.bFlame.material.uniforms.power.value = 0.5 + F.thr * 0.5; r.bFlame.material.uniforms.vac.value = vac;
  r.bFlame.scale.set(1 + vac * 0.4, 0.7 + F.thr * 0.5 + vac * 1.5, 1 + vac * 0.4);
  r.light.intensity = f.thrustOn ? 3e4 * (1 - vac) : 0;
  // exhaust + vapor
  const dir = new THREE.Vector3(Math.sin(f.theta), Math.cos(f.theta), 0);
  const nozzle = r.root.position.clone().addScaledVector(dir, -2);
  if (f.thrustOn) {
    const n = f.y < 1500 ? 9 : f.y < 25000 ? 4 : 1;
    for (let i = 0; i < n; i++) {
      const lag = Math.random() * 30 * warp * dt;
      smoke.spawn(nozzle.x - dir.x * lag + (Math.random() - .5) * 2, nozzle.y - dir.y * lag, (Math.random() - .5) * 2, -dir.x * 20 + (Math.random() - .5) * 8, -dir.y * 20, (Math.random() - .5) * 8,
        { life: f.y < 1500 ? 7 : 3.5, s0: 4, s1: f.y < 1500 ? 30 : 18 + vac * 40, c0: [0.95, 0.9, 0.84], c1: [0.85, 0.82, 0.8], a: 0.55 * (1 - vac * 0.6), drag: 0.25 });
    }
    if (f.t < 7) for (let i = 0; i < 6; i++) { const a = Math.random() * Math.PI * 2; smoke.spawn(MOUNT_X + Math.cos(a) * 4, 2, Math.sin(a) * 4, Math.cos(a) * 50, 5, Math.sin(a) * 50 - 12, { life: 7, s0: 12, s1: 50, c0: [0.92, 0.86, 0.78], a: 0.7, drag: 0.5 }); }
  }
  const v = Math.hypot(f.vx, f.vy);
  if (v > 300 && v < 420 && f.y < 16000) {
    F.vapor = 1; if (!F.sonic) { F.sonic = true; sfx.sonic(); }
    for (let i = 0; i < 6; i++) { const a = Math.random() * Math.PI * 2, p = r.root.position; smoke.spawn(p.x + dir.x * 22 + Math.cos(a) * 3.2, p.y + dir.y * 22, Math.sin(a) * 3.2, -dir.x * 30, -dir.y * 30, 0, { life: 0.6, s0: 4, s1: 9, c0: [1, 1, 1], a: 0.7, drag: 2 }); }
  }
  sfx.engine(f.thrustOn ? 0.6 * F.thr * (1 - vac * 0.8) : 0);
  if (f.y < 800) shake = Math.max(shake, 0.18 * (1 - f.y / 800));
  // camera
  const camT = r.root.position.clone().addScaledVector(dir, r.totalH * 0.45);
  setGoal({ target: camT, dist: Math.min(220, 70 + r.totalH * 0.8 + f.y * 0.002), el: 0.06, az: null, auto: 0.03, speed: 6, minD: 30, maxD: 2000, snap: true });
  focusShadows(new THREE.Vector3(r.root.position.x, Math.min(r.root.position.y, 120), 0));
  // HUD
  const m = Math.floor(f.t / 60), s = Math.floor(f.t % 60);
  $('hT').textContent = `${m}:${String(s).padStart(2, '0')}`;
  $('hAlt').textContent = (f.y / 1000).toFixed(1);
  $('hVel').textContent = fmtI(v);
  $('hG').textContent = f.accelG.toFixed(1);
  $('hQ').textContent = (f.qEff / 1000).toFixed(1) + ' kPa';
  $('qFill').style.width = Math.min(100, f.qEff / (L.Q_LIMIT / 0.75) * 100) + '%';
  $('qFill').style.background = f.qEff > L.Q_LIMIT ? 'var(--nogo)' : f.qEff > 0.8 * L.Q_LIMIT ? 'var(--gold)' : 'var(--data)';
  $('gQ').classList.toggle('hot', f.qEff > 0.85 * L.Q_LIMIT && F.thr > 0.6);
  $('hS').textContent = pct(f.stress); $('sFill').style.width = Math.min(100, f.stress * 100) + '%';
  $('gS').classList.toggle('hot', f.stress > 0.25);
  $('hEng').textContent = `${f.nEng}/${f.nEng0}`;
  $('hFuel').textContent = pct(res) + (res >= 0.05 && res <= 0.14 ? ' · in zone' : '');
  $('fuelFill').style.width = (res * 100) + '%';
  const canStage = f.y > 12000 && !F.staged;
  $('btnStage').disabled = !canStage; $('btnStage').classList.toggle('ready', canStage && res <= 0.14 && res >= 0.05);
  // coaching
  if (f.t < 9) coach('Liftoff! Watch the MAX-Q gauge. Throttle down before it reaches the red line.');
  else if (f.stress > 0.3) coach('The airframe is groaning. Throttle down NOW.', true);
  else if (f.qEff > 0.82 * L.Q_LIMIT && F.thr > 0.72) coach('MAX-Q! Throttle down to ~60% (S key or the 50/70 buttons).', true);
  else if (f.y > 20000 && f.qEff < 0.5 * L.Q_LIMIT && F.thr < 0.95 && res > 0.2) coach('Past Max-Q. Throttle back up to 100% for more speed.');
  else if (res < 0.05 && res > 0) coach('Below the boostback minimum. This booster is not coming home, but the upper stage will thank you.');
  else if (res <= 0.14) coach('In the recovery zone. SEPARATE now to bring the booster home, or burn on for more ΔV.');
  else if (res < 0.26) coach('Booster fuel getting low. Separate inside the green RECOVERY zone to catch it.');
  else if (f.y > 12000) coach(`Climbing. Separation unlocks above 12 km. Target ${fmtI(F.P.target)} m/s total.`);
  else coach('Hold it steady through the thick air.');
  // outcomes
  if (f.done) { rocketBoom(); return; }
  if (f.propB <= 0 && !F.staged) { callout('MECO', '', 'Booster ran dry. No fuel to come home.', 1800); doStage(true); }
}

function rocketBoom() {
  const r = FL.r; explode(r.root.position.clone(), 1.6);
  r.root.visible = false; sfx.engine(0); coach('');
  callout('RAPID UNSCHEDULED DISASSEMBLY', 'red', FL.f.result === 'rud-maxq' ? 'Max-Q tore it apart. Throttle down next time.' : 'It did not like the ground.', 3000);
  mode = 'aftermath'; FL.after = 3.2; FL.outcome = { kind: 'rud', success: false, catch: 'destroyed' };
  S.rud++;
}

function doStage(meco) {
  const F = FL, f = F.f, r = F.r;
  F.staged = true; F.meco = meco;
  F.res = L.stageResult(f, F.P.target);
  scene.attach(r.booster);
  r.bFlame.visible = false; r.light.intensity = 0;
  F.U = 0; F.fairingOff = false; F.uLit = false; F.bSpin = 0;
  mode = 'upper'; sfx.engine(0); sfx.clank();
  for (let i = 0; i < 40; i++) { const p = r.upper.getWorldPosition(_v1); smoke.spawn(p.x, p.y, p.z, (Math.random() - .5) * 20, (Math.random() - .5) * 20, (Math.random() - .5) * 20, { life: 1.4, s0: 2, s1: 9, c0: [1, 1, 1], a: 0.7, drag: 1.5 }); }
  callout('STAGE SEP', '', meco ? '' : `Booster reserve ${pct(F.res.reserve)}`, 1500);
  $('btnStage').disabled = true; $('btnStage').classList.remove('ready');
}

function updateUpper(dt) {
  const F = FL, r = F.r, R = F.res;
  F.U += dt;
  const dir = new THREE.Vector3(0, 1, 0).applyQuaternion(r.root.quaternion);
  r.root.position.addScaledVector(dir, (4 + F.U * F.U * 6) * dt);
  r.booster.position.addScaledVector(dir, -3 * dt); r.booster.rotateZ(dt * 0.25); r.booster.rotateX(dt * 0.12);
  if (F.U > 0.3 && F.U < 2.5 && Math.random() < 0.5) { const bp = r.booster.localToWorld(_v2.set(0, r.boosterH - 1, 0)); smoke.spawn(bp.x, bp.y, bp.z, (Math.random() - .5) * 18, 0, (Math.random() - .5) * 18, { life: 0.8, s0: 1, s1: 5, c0: [1, 1, 1], a: 0.6, drag: 2 }); }
  if (F.U > 1.0 && !F.uLit) { F.uLit = true; r.uFlame.visible = true; r.uFlame.material.uniforms.vac.value = 1; sfx.whoosh(); }
  if (F.uLit) { r.uFlame.material.uniforms.power.value = 1; r.uFlame.scale.set(1.3, 1.6, 1.3); }
  if (F.U > 2.4 && !F.fairingOff) {
    F.fairingOff = true; scene.attach(r.fairL); scene.attach(r.fairR);
    F.fv = [new THREE.Vector3(0, 0, 6), new THREE.Vector3(0, 0, -6)]; sfx.click();
  }
  if (F.fairingOff) {
    r.fairL.position.addScaledVector(F.fv[0], dt); r.fairR.position.addScaledVector(F.fv[1], dt);
    r.fairL.rotateX(dt * 0.6); r.fairR.rotateX(-dt * 0.6);
    r.fairL.position.addScaledVector(dir, -6 * dt); r.fairR.position.addScaledVector(dir, -6 * dt);
  }
  // debris event
  const tier = F.P.tier;
  if (F.U > 3.6 && F.debris === null) {
    F.debris = 'none';
    if (tier >= 1 && rnd() < 0.24) {
      const p = r.upper.getWorldPosition(_v2);
      for (let i = 0; i < 50; i++) fire.spawn(p.x, p.y + 4, p.z, (Math.random() - .5) * 40, (Math.random() - .5) * 40, (Math.random() - .5) * 40, { life: 0.5, s0: 1.2, s1: 0.2, c0: [1, 0.9, 0.6], c1: [1, 0.4, 0.1], drag: 2 });
      if (F.P.design.shield === 'pancake') { F.debris = 'pancaked'; callout('PANCAKED!', 'gold', 'The Pancake Block Shield flattened a chunk of space junk.', 2200); sfx.clank(); }
      else { F.debris = 'hit'; callout('DEBRIS STRIKE', 'red', 'Space junk dinged the payload. Partial pay only.', 2200); sfx.clank(); }
    }
  }
  // velocity readout climbs to the final number
  const k = THREE.MathUtils.clamp((F.U - 1.0) / 4.4, 0, 1);
  const vNow = R.vStage + R.upperEff * (1 - Math.pow(1 - k, 2));
  $('hVel').textContent = fmtI(vNow); $('hAlt').textContent = (F.f.y / 1000 + k * (R.success ? 140 : 60)).toFixed(1);
  $('hFuel').textContent = 'booster away'; $('hEng').textContent = 'upper';
  coach(`Upper stage burning: ${fmtI(vNow)} of ${fmtI(R.target)} m/s`);
  setGoal({ target: r.upper.getWorldPosition(_v2).clone().addScaledVector(dir, 6), dist: 60, el: 0.12, auto: 0.05, speed: 5, snap: true });
  if (F.U > 6.2 && !F.cardShown) { F.cardShown = true; missionCard(); }
}

function missionCard() {
  const F = FL, R = F.res, P = F.P, tier = P.tier;
  const names = ['APOGEE REACHED', 'ORBIT ACHIEVED', 'TRANS-LUNAR INJECTION', 'TRANS-MARS INJECTION'];
  const ok = R.success;
  const c = P.contract ? S.contracts.find(x => x.id === P.contract) : null;
  let lead;

// ---------------- results ----------------
function showResults() {

  const lines = [], before = { hype: S.hype, morale: S.morale, price: S.price };

  lines.push(['Rocket and pad ops (paid at rollout)', -(P.cost + L.PAD_OPS)]);
  if (O.success) {
    if (c) {
      const mult = L.payoutMult(S.hype); let pay = c.pay * mult;
      if (O.debris === 'hit') pay *= 0.45;
      lines.push([`${c.client} payout (hype ×${mult.toFixed(2)}${O.debris === 'hit' ? ', debris −55%' : ''})`, pay]); cash += pay;
      dh += 8; dm += 6; dp += 0.06;
      if (c.tier === S.tier) {
        S.done[S.tier]++;
        if (S.done[S.tier] >= L.TIERS[S.tier].need) {
          if (S.tier === 3) S.won = true;

        }

      news(c.tier === 3 && O.success ? 'Kittle Aerospace lands on Mars. Touchdown!' : `${c.client}'s ${c.mission.toLowerCase()} delivered by Kittle Aerospace.`);
    } else { lines.push(['Test flight (no payout)', 0]); dh += 2; dm += 3; }
    if (O.debris === 'pancaked') dh += 3;
  } else {
    lines.push([c ? `${c.client}: mission failed, no payout` : 'Test flight failed', 0]);
    dh -= O.kind === 'rud' ? 15 : 8; dm -= 12; dp -= 0.12;
    if (c) news(`${c.client} is "evaluating other providers" after a Kittle Aerospace failure.`);
  }
  const bc = P.boosterCost;
  switch (O.catch) {
    case 'spike': lines.push(['Booster caught: refurb credit 85%', bc * 0.85], ['Spike Celebration sponsor bonus', 1.5]); cash += bc * 0.85 + 1.5; dh += 12; dm += 10; dp += 0.08; S.catches++; S.spikes++; break;
    case 'clean': lines.push(['Booster caught: refurb credit 80%', bc * 0.8]); cash += bc * 0.8; dh += 6; dm += 6; dp += 0.03; S.catches++; break;
    case 'bobble': lines.push(['Booster bobbled: refurb credit 45%', bc * 0.45]); cash += bc * 0.45; dh += 2; dm += 1; S.catches++; break;
    case 'miss': lines.push(['Booster missed the catch', 0]); dh -= 8; dm -= 6; dp -= 0.05;

  if (c) { S.contracts = S.contracts.filter(x => x !== c); if (S.active === c.id) S.active = null; }
  S.launches++; S.pad = null;
  refillContracts(); save();
  const net = cash - (P.cost + L.PAD_OPS);

}

// ---------------- keyboard ----------------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['input', 'textarea'].includes((e.target.tagName || '').toLowerCase())) return;
  keys.add(k);
  if (mode === 'flight' && FL) {
    if (k === 'w' || k === 'arrowup') { setThrottleUI(FL.thr + 0.1); e.preventDefault(); }
    if (k === 's' || k === 'arrowdown') { setThrottleUI(FL.thr - 0.1); e.preventDefault(); }
    if (k === ' ' || k === 'enter') { if (!$('btnStage').disabled) doStage(false); e.preventDefault(); }
    if (k === 't') $('btnWarp').click();
  } else if (mode === 'catch') {
    if (k === ' ' || k === 'enter') { closeHands(); e.preventDefault(); }
    if (k.startsWith('arrow')) e.preventDefault();
  }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

// ---------------- resize + main loop ----------------
function updateViewOffset() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  if (!$('panel').hidden) {
    const r = $('panel').getBoundingClientRect();
    if (innerWidth >= 900) camera.setViewOffset(w, h, Math.round((r.width + 16) / 2), 0, w, h);
    else camera.setViewOffset(w, h, 0, Math.round((r.height + 70) * 0.42), w, h);
  } else camera.clearViewOffset();
}
function resize() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); updateViewOffset();
  const scale = h * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  for (const p of [smoke, fire, confetti]) p.mat.uniforms.scale.value = scale;
}
addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(TEST.dtMax, (now - last) / 1000); last = now; clockT += dt;
  try {
    if (mode === 'countdown') updateCountdown(dt);
    else if (mode === 'flight') updateFlight(dt);
    else if (mode === 'upper') updateUpper(dt);
    else if (mode === 'catch') updateCatch(dt);
    else if (mode === 'aftermath') { FL.after -= dt; if (FL.after <= 0) { mode = 'results-wait'; showResults(); } }
    if (snapAnim > 0 && vabRocket) { snapAnim = Math.max(0, snapAnim - dt * 3); vabRocket.root.scale.setScalar(1 + Math.sin(snapAnim * Math.PI) * 0.04); }
    for (const fl of [padRocket, FL && FL.r, catchRig]) if (fl) { fl.bFlame.material.uniforms.t.value = clockT; fl.uFlame.material.uniforms.t.value = clockT; }
    smoke.update(dt); fire.update(dt); confetti.update(dt); updateDebris(dt);
    updateCamera(dt);
    updateEnvironment(dt, camera.position);
  } catch (err) { console.error(err); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------------- boot ----------------
function start(data) {
  resize();
  const sv = data && data.save;
  if (sv && !sv.lost && !sv.won) { S = sv; startWith(sv); } else toTitle();
  setWeatherVisual({ cond: 'Clear', wind: 10 });
  if (S) setWeatherVisual(S.weather[0]);
  requestAnimationFrame(t => { last = t; frame(t); });
  window.__yac = { TEST, joy, get S() { return S; }, get mode() { return mode; }, act, get FL() { return FL; }, get CT() { return CT; }, L, closeHands, doStage: () => doStage(false), setThrottleUI };
}
try { window.claude?.hot?.snapshot?.(() => ({ save: S && !S.lost && !S.won && ['hq', 'hangar', 'rnd', 'pad'].includes(mode) ? S : null })); } catch (e) { }
const boot = d => {
  const fl = document.fonts && document.fonts.load ? Promise.all(['100px "Saira Stencil One"', '600 16px "JetBrains Mono"', '600 16px "Barlow Semi Condensed"'].map(f => document.fonts.load(f))) : Promise.resolve();
  Promise.race([fl, new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => { refreshWordTextures(); start(d); });
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
